<!DOCTYPE html>
<html lang="en" class="theme-loading">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — GreenNest</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="Create your GreenNest account.">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac', 400: '#4ade80', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534', 900: '#14532d' },
            cream: { 50: '#fefae0', 100: '#fcf6d4', 200: '#f7ecc0', 300: '#f0dfa0', 400: '#e6cc7a', 500: '#dbb95a', 600: '#c9a344', 700: '#a8823a', 800: '#8a6834', 900: '#716031' }
          },
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-cream-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 theme-loading">

  <script src="js/main.js"></script>

  <!-- Minimal Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 shadow-sm no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-3 group">
          <div class="w-9 h-9 bg-green-700 dark:bg-green-500 rounded-xl flex items-center justify-center transition-transform group-hover:scale-110 shrink-0">
            <i data-lucide="leaf" class="w-5 h-5 text-white"></i>
          </div>
          <span class="text-xl font-bold text-green-800 dark:text-green-300 tracking-tight">GreenNest</span>
        </a>

        <div class="flex items-center space-x-2">
          <button onclick="toggleTheme()" class="p-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="Toggle theme">
            <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
            <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
          </button>
          <button onclick="toggleDir()" class="px-2.5 py-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors text-sm font-semibold" title="Toggle RTL / LTR direction" id="dir-toggle">
            <span id="dir-label">LTR</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <main class="pt-20 min-h-screen flex items-center justify-center py-12">
    <div class="w-full max-w-4xl mx-auto px-4 sm:px-6">
      <div class="bg-white dark:bg-gray-800 rounded-3xl shadow-lg overflow-hidden grid grid-cols-1 lg:grid-cols-2">

        <div class="hidden lg:flex relative h-full">
          <img src="assets/images/about.jpg" alt="GreenNest plants" class="absolute inset-0 w-full h-full object-cover">
          <div class="absolute inset-0 bg-gradient-to-t from-green-900/80 via-green-900/20 to-transparent flex items-end p-8">
            <div>
              <h2 class="text-2xl font-bold text-white">Join GreenNest</h2>
              <p class="text-green-100/90 text-sm">Create an account to start growing your dream garden with us.</p>
            </div>
          </div>
        </div>

        <div class="p-8 sm:p-10">
          <div class="mb-8">
            <div class="w-14 h-14 bg-green-100 dark:bg-green-900/40 rounded-2xl flex items-center justify-center mb-4 lg:hidden">
              <i data-lucide="user-plus" class="w-7 h-7 text-green-700 dark:text-green-400"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Create Your Account</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Join the GreenNest community</p>
          </div>

          <form id="signup-form">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
              <div>
                <label for="signup-fname" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">First Name</label>
                <input type="text" id="signup-fname" name="fname" placeholder="Jane" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-cream-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500">
                <p class="field-error hidden text-xs text-red-600 mt-1"></p>
              </div>
              <div>
                <label for="signup-lname" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Last Name</label>
                <input type="text" id="signup-lname" name="lname" placeholder="Doe" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-cream-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500">
                <p class="field-error hidden text-xs text-red-600 mt-1"></p>
              </div>
            </div>

            <div class="mb-5">
              <label for="signup-email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
              <input type="email" id="signup-email" name="email" placeholder="you@email.com" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-cream-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500">
              <p class="field-error hidden text-xs text-red-600 mt-1"></p>
            </div>

            <div class="mb-5">
              <label for="signup-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Password</label>
              <div class="relative">
                <input type="password" id="signup-password" name="password" placeholder="Create a password (min 6 characters)" class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl bg-cream-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-green-500 pr-11">
                <button type="button" onclick="togglePassword('signup-password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                  <i data-lucide="eye" class="w-5 h-5"></i>
                </button>
              </div>
              <p class="field-error hidden text-xs text-red-600 mt-1"></p>
            </div>

            <button type="submit" class="w-full py-3.5 bg-green-700 hover:bg-green-800 dark:bg-green-600 dark:hover:bg-green-700 text-white font-semibold rounded-xl transition-colors flex items-center justify-center mb-4">
              <i data-lucide="user-plus" class="w-5 h-5 mr-2"></i>Create Account
            </button>

            <p class="text-sm text-center text-gray-500 dark:text-gray-400">
              Already have an account?
              <a href="login.html" class="text-green-700 dark:text-green-400 font-medium hover:underline">Log in</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script>
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword
        ? '<i data-lucide="eye-off" class="w-5 h-5"></i>'
        : '<i data-lucide="eye" class="w-5 h-5"></i>';
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', function () {
      updateDirLabel();
      updateThemeIcons();
      if (typeof lucide !== 'undefined') lucide.createIcons();

      const form = document.getElementById('signup-form');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        let valid = true;
        const fields = [
          { el: document.getElementById('signup-fname'), label: 'Please enter your first name' },
          { el: document.getElementById('signup-lname'), label: 'Please enter your last name' },
          { el: document.getElementById('signup-email'), label: 'Please enter a valid email address', validate: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) },
          { el: document.getElementById('signup-password'), label: 'Password must be at least 6 characters', validate: (v) => v.length >= 6 }
        ];
        fields.forEach(function (f) {
          const value = f.el.value.trim();
          const err = f.el.parentElement.querySelector('.field-error');
          let error = '';
          if (!value) error = f.label;
          else if (f.validate && !f.validate(value)) error = f.label;
          if (error) { f.el.classList.add('border-red-500'); err.textContent = error; err.classList.remove('hidden'); valid = false; }
          else { f.el.classList.remove('border-red-500'); err.classList.add('hidden'); }
        });
        if (valid) {
          const prefs = JSON.parse(localStorage.getItem('greennest_preferences') || '{}');
          const users = prefs.users || [];
          users.push({ name: document.getElementById('signup-fname').value.trim() + ' ' + document.getElementById('signup-lname').value.trim(), email: document.getElementById('signup-email').value.trim() });
          prefs.users = users;
          localStorage.setItem('greennest_preferences', JSON.stringify(prefs));
          showToast('Account created successfully! Welcome to GreenNest.', 'success');
          form.reset();
        } else {
          showToast('Please fix the errors in the form.', 'error');
        }
      });
    });
  </script>

</body>
</html>
