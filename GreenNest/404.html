            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']

        <a href="products.html" class="inline-flex items-center justify-center px-8 py-3.5 border border-green-700 dark:border-green-500 text-green-700 dark:text-green-400 hover:bg-green-50 dark:hover:bg-green-900/30 font-semibold rounded-xl transition-colors">
